<script>

let SC=1,TOP=0,BOT=0,cw0=0,ch0=0,errT='';const pe=document.createElement('div');pe.style.cssText='position:fixed;left:0;top:0;visibility:hidden;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)';document.body.appendChild(pe);
function rs(){D=window.devicePixelRatio||1;cw0=window.innerWidth;ch0=window.innerHeight;const iw=Math.max(1,cw0),ih=Math.max(1,ch0);SC=Math.max(.1,Math.min(iw/400,ih/760));W=iw/SC;H=ih/SC;cv.width=Math.round(iw*D);cv.height=Math.round(ih*D);const cs=getComputedStyle(pe);TOP=(parseFloat(cs.paddingTop)||0)/SC;BOT=(parseFloat(cs.paddingBottom)||0)/SC;g.setTransform(D*SC,0,0,D*SC,0,0);SP=H*.5;HB=SP*.5}

try{S=Object.assign(S,JSON.parse(localStorage.getItem('ws2')||'{}'));R=Object.assign(R,JSON.parse(localStorage.getItem('wr2')||'{}'))}catch(e){}

const cur=()=>M[S.diff],vib=p=>{if(S.vib&&navigator.vibrate)try{navigator.vibrate(p)}catch(e){}};
const WORMS=[
{id:'zombie',n:'Зомби-червь',d:'Эталонный червь с черепом вместо головы.',p:'Сбалансирован',m:'Без особых талантов',spd:1,o2:1,bite:1,L:1,w:1,f:1,amp:1,c1:'#b7ab9d',c2:'#b7ab9d',oc:'#150808'},
{id:'earth',n:'Дождевой червь',d:'Lumbricus terrestris. Розовый, с утолщением-поясом. Неспешный и выносливый.',p:'Экономный, укусы слабее',m:'Ползёт медленнее',spd:.9,o2:.9,bite:.8,L:1,w:1.05,f:.8,amp:1,c1:'#d98a8a',c2:'#c97474',oc:'#5a2a2a'},
{id:'blood',n:'Мотыль',d:'Личинка комара-звонца. Тонкий красный живчик, извивается очень быстро.',p:'Самый быстрый',m:'Жрёт кислород, хрупкий',spd:1.3,o2:1.3,bite:1.4,L:.75,w:.7,f:2.2,amp:.55,c1:'#e02424',c2:'#b01818',oc:'#4a0808'},
{id:'silk',n:'Шелкопряд',d:'Тутовый шелкопряд. Толстая кремовая гусеница с рожком на хвосте.',p:'Укусы почти не страшны, дышит экономно',m:'Самый медленный',spd:.8,o2:.8,bite:.6,L:.85,w:1.4,f:.6,amp:.7,c1:'#f2ecd0',c2:'#e4dcb4',oc:'#6a6040'},
{id:'leech',n:'Пиявка',d:'Плоская, тёмная, с оранжевой полосой. Ползёт рывками, как землемер.',p:'Быстрая',m:'Прожорливая',spd:1.15,o2:1.15,bite:1,L:1,w:1.1,f:1,amp:.8,c1:'#4a5a2a',c2:'#3a4820',oc:'#101808'},
{id:'nereis',n:'Нереис',d:'Морской многощетинковый червь. Радужный, с рядами лапок-щетинок.',p:'Быстрый, укусы чуть слабее',m:'Расход кислорода выше',spd:1.1,o2:1.1,bite:.9,L:1,w:.95,f:1.3,amp:1.2,c1:'#2ab8b0',c2:'#6a5ad0',oc:'#0a2a30'}];
function curWorm(){return WORMS.find(w=>w.id===S.worm)||WORMS[0]}
const rnd=(a,b)=>a+Math.random()*(b-a),cl=(v,a,b)=>Math.max(a,Math.min(b,v));
const hash=(a,b)=>{let h=Math.imul(a,374761393)+Math.imul(b,668265263);h=Math.imul(h^h>>>13,1274126177);return((h^h>>>16)>>>0)/4294967295};
const fmt=c=>c>=100?(c/100).toFixed(2)+' м':c.toFixed(1)+' см';
const medal=c=>c>=1000?'🥇':c>=500?'🥈':c>=200?'🥉':'';
// ---- audio (синтез, без лицензий)
let AC,mg,nextT=0,step=0,tempoNow=1.2;
const sc=[0,3,5,7,10,12,15];
function initAudio(){if(AC)return;try{AC=new (window.AudioContext||window.webkitAudioContext)();mg=AC.createGain();mg.connect(AC.destination);setInterval(sched,50)}catch(e){}}
function tone(f,t,d,type,v,f2){const o=AC.createOscillator(),e=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);e.gain.setValueAtTime(0,t);e.gain.linearRampToValueAtTime(v,t+.02);e.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(e);e.connect(mg);o.start(t);o.stop(t+d+.05)}
function noise(t,d,v,fr=6000,ty='highpass'){const n=AC.sampleRate*d,b=AC.createBuffer(1,n,AC.sampleRate),a=b.getChannelData(0);for(let i=0;i<n;i++)a[i]=Math.random()*2-1;const s=AC.createBufferSource(),e=AC.createGain(),f=AC.createBiquadFilter();f.type=ty;f.frequency.value=fr;s.buffer=b;e.gain.setValueAtTime(v,t);e.gain.exponentialRampToValueAtTime(.0001,t+d);s.connect(f);f.connect(e);e.connect(mg);s.start(t)}
let curTheme='';
const FQ=n=>220*Math.pow(2,n/12);
const MUS={
 menu:{base:.5,f(t,sl,k,st){const ch=[[0,3,7],[-4,0,3],[3,7,10],[-2,2,5]][(st>>3)&3];if(k%8===0)ch.forEach(n=>tone(FQ(n),t,sl*8,'triangle',.06));if(k%2===0)tone(FQ(ch[(st>>1)%3]+12),t,sl*3,'sine',.07)}},
 run:{base:.28,f(t,sl,k,st,lv){if(k===0)tone(55,t,sl*8,'sine',.35);if(k%2===0||lv>1.8){const n=sc[(st*3+(st>>4))%7];tone(220*Math.pow(2,n/12)*(lv>2.4&&k%4===2?2:1),t,sl*1.6,'triangle',.12)}if(lv>1.5&&k%4===0)tone(70,t,.15,'sine',.5);if(lv>2.2&&k%2===1)noise(t,.05,.15)}},
 jump:{base:.17,f(t,sl,k,st){const ch=[[3,7,10],[0,3,7],[-4,0,3],[-2,2,5]][(st>>4)&3];if(k%2===0)tone(FQ(ch[(k>>1)%3]+12+(k%4===0?12:0)),t,sl*1.5,'square',.05);if(k%4===0)tone(FQ(ch[0]-24),t,sl*2.5,'triangle',.18);if(k%8===0)tone(90,t,.12,'sine',.35,45);if(k%2===1)noise(t,.03,.06)}},
 surv:{base:.34,f(t,sl,k,st,lv){const sc2=[0,1,3,5,7,8,10];if(k===0){tone(FQ(0)/4,t,sl*16,'sine',.3);tone(FQ(0)/2,t,sl*16,'sawtooth',.05);noise(t,.5,.05,300,'lowpass')}if(k===0||k===3)tone(60,t,.14,'sine',.5,38);if(k%8===5)tone(FQ(sc2[(st*7)%7]+24),t,sl*5,'sine',.05);if(lv>1.5&&k%8===2)tone(FQ(13),t,sl*2,'sawtooth',.04);if(lv>2&&k%2===1)noise(t,.04,.08)}},
 race:{base:.15,f(t,sl,k,st){const root=[0,0,3,0,-2,-2,3,5][(st>>1)&7];if(k%4===0)tone(62,t,.15,'sine',.6,36);if(k%4===2)noise(t,.04,.1);if(k%8===4)noise(t,.12,.16,1500);if(k%2===0)tone(FQ(root-24),t,sl*1.6,'sawtooth',.12);tone(FQ(sc[(st*5)%7]+12),t,sl*1.1,'square',.035)}},
 boss:{base:.22,f(t,sl,k,st,lv){const r=[0,-2,-4,-5][(st>>4)&3],h=[0,2,3,5,7,8,11];if(k%8===0){tone(FQ(r-24),t,sl*7,'sawtooth',.13);tone(FQ(r-17),t,sl*7,'sawtooth',.09);tone(66,t,.3,'sine',.7,38)}if(k%8===6)tone(66,t,.25,'sine',.55,38);if(k%8===4)noise(t,.15,.28,1800);if(k%4===0)tone(FQ(r+h[((st>>2)*3)%7]+12),t,sl*3,'square',.06);if(lv>1.8&&k%2===1)noise(t,.03,.1)}}
};
function themeNow(){if(mode==='menu')return 'menu';if(GM==='jump')return 'jump';if(GM==='race')return 'race';if(GM==='boss'||(boss&&mode!=='over'))return 'boss';if(GM==='surv')return 'surv';return 'run'}
function sched(){if(!AC)return;mg.gain.value=S.music?S.vol*.5*(mode==='play'||mode==='menu'||mode==='jump'||mode==='race'?1:.3):0;if(AC.state==='suspended')AC.resume();
 const th=themeNow(),M0=MUS[th];if(th!==curTheme){curTheme=th;step=0;nextT=AC.currentTime+.08}
 if(nextT<AC.currentTime)nextT=AC.currentTime+.05;
 while(nextT<AC.currentTime+.15){const lv=th==='boss'&&boss?1.3+(1-boss.hp/boss.max)*1.2:th==='menu'?1:tempoNow,sl=M0.base/Math.max(.3,lv)**.8;M0.f(nextT,sl,step%16,step,lv);nextT+=sl;step++}}
const blip=f=>{if(AC&&S.music)tone(f,AC.currentTime,.12,'square',.08)};
const sfx=(a)=>{if(!AC||!S.music)return;const t=AC.currentTime;if(a==='boom'){noise(t,.6,.7,900,'lowpass');tone(120,t,.5,'sawtooth',.4,30)}else if(a==='bite'){tone(300,t,.25,'sawtooth',.25,80);noise(t,.1,.3,2000)}else if(a==='bad'){tone(400,t,.3,'sawtooth',.25,100)}else if(a==='gold'){[0,4,7,12].forEach((n,i)=>tone(660*Math.pow(2,n/12),t+i*.06,.15,'triangle',.15))}}
// ---- state
let mode='menu',cm,taps,oxy,t0,tankPen,items,nextItem,targets,spawnT,hits,thr,slide,drag,pull,nud,dispCm,parts,fx,moles,msg,msgT,lastV,streak,tr,len,dl,sm,shake,flash,seenS,seenT,wph=0,big=null,freeze=0,nextTank=0,lastTx=0,sup=false,band=null,nextSup=0,sws=null,gtaps=0,blk=0,back=0,seenC=0,lives=0,haze=0,hzf=0,burger=null,tg=0,lifeCd=0,nextGas=0,lGot=0,lUsed=0,bugs=[],bugT=0,bio=0,huO=0,mdl=0,recHit=0,hb=0,bestStreak=0,tanks=[],kbN=0,nextKb=0,kbGot=0,pops=[],waveCd=0,wave=0,waveT=0,boss=null,nextBoss=250,bossCd=1.5,bossWins=0,bossHpMul=1,seenB=0,GM='run',rm='play',J=null,trc=null,bossLv=0,gl=0,scr='home',wsel=0;
function reset(){cm=0;dispCm=0;taps=0;oxy=100;t0=0;tankPen=0;items=[];nextItem=5*cur().u;targets=[];spawnT=0;hits=0;thr=Math.floor(rnd(3,6));slide=0;drag=null;pull=0;nud=0;parts=[];fx=[];moles=[];msg='';msgT=0;lastV=0;streak=0;tr=0;len=1;dl=1;sm=curWorm().spd;shake=0;flash=0;seenS=0;seenT=0;big=null;freeze=0;nextTank=12*cur().u;lastTx=W/2;sup=false;band=null;nextSup=rnd(25,50)*cur().u;sws=null;gtaps=0;blk=0;back=0;seenC=0;lives=0;haze=0;hzf=0;burger=null;tg=0;lifeCd=0;nextGas=rnd(18,30)*cur().u;lGot=0;lUsed=0;bugs=[];bugT=rnd(8,14);bio=0;mdl=0;recHit=0;hb=0;bestStreak=0;tanks=[];kbN=0;nextKb=rnd(100,200);kbGot=0;pops=[];waveCd=rnd(8,12);wave=0;waveT=0;boss=null;nextBoss=250;bossCd=1.5;bossWins=0;bossHpMul=1;seenB=0;trc=null;bossLv=0;gl=0}
reset();
const tempo=()=>{const b=Math.max(.8,1+Math.min(tg/45,2.5)*cur().k-tankPen*cur().k);return b*(1-hzf)+.5*hzf};
const say=m=>{msg=m;msgT=1.6};
function spawnItems(){const u=cur().u;while(nextItem<cm+45*u){const k=Math.floor(rnd(0,4));items.push({d:nextItem,x:k===3?W/2+rnd(-40,40):rnd(30,W-30),tank:false,k,s:rnd(.8,1.3),r:rnd(0,6),c:Math.floor(rnd(0,360))});nextItem+=rnd(3,7)*u}
 while(nextTank<cm+45*u){let x=rnd(40,W-40);for(let i=0;i<8&&Math.abs(x-lastTx)<W*.35;i++)x=rnd(40,W-40);lastTx=x;items.push({d:nextTank,x,tank:true,k:9,s:1.7,r:0,c:0});nextTank+=rnd(GM==='surv'?9:14,GM==='surv'?15:24)*u}
 while(nextGas<cm+45*u){items.push({d:nextGas,x:rnd(40,W-40),tank:false,gas:true,k:10,s:1.7,r:0,c:0});nextGas+=rnd(30,50)*u}}
function spawnTarget(f){if(!f&&(sup||haze>0)&&targets.length>=2)return;const r=rnd(28,40),x=rnd(r+8,W-r-8),y=rnd(SP+r+60,H-BOT-r-30);if(targets.some(t=>Math.hypot(t.x-x,t.y-y)<r*2.4))return;const m=cur(),re=m.red*cl(.5+tr/3,.5,1.6),gp={easy:.06,mid:.1,hard:.14}[S.diff],q=Math.random();let k=f?f:sup?'s':haze>0?'n':boss?(Math.random()<bossRed()?'r':'n'):q<re?'r':q<re+.07?'y':q<re+.07+gp?'e':'n',dir=0;if(!f&&!sup&&haze<=0&&lGot<3&&lifeCd<=0&&Math.random()<.06){k='p';lifeCd=15}if(sup)dir=x<100?1:x>W-100?-1:Math.random()<.5?1:-1;let pts=null;if(!f&&k==='n'&&!sup&&haze<=0&&!big&&Math.random()<(boss?.14:.09)){k='l';pts=trailPts(x,y)}targets.push({x,y,r,k,dir,pts,born:t0,sp:t0,life:(k==='r'?2.2:k==='s'?3.4:k==='p'?2:k==='l'?4.5:2.6)*m.life/tempo()})}
function puff(x,y,c,n,sp=1){for(let i=0;i<n;i++)parts.push({x,y,vx:rnd(-90,90)*sp,vy:rnd(-130,30)*sp,l:rnd(.4,.8),c,s:rnd(3,6)})}
function startBig(){targets=[];const r=Math.min(W*.42,(H-SP)*.4);big={x:W/2,y:SP+(H-SP-BOT)/2,r,t:3,gain:0,p:0};say('БОЛЬШОЙ КРУГ! Тапай!');vib([60,40,60,40,120]);sfx('gold')}
function popup(t){mode='pop';drag=null;panel(`<p style="font-size:19px;font-weight:600">${t}</p><button onclick="mode='play';hide()">Ок</button>`)}
function explode(b){streak=0;shake=.5;flash=.35;fx.push({x:b.x,y:b.y,l:.6});puff(b.x,b.y,'#f53',22,1.6);puff(b.x,b.y,'#fb3',16,1.2);vib([80,30,120]);sfx('boom');say('БАБАХ! Крот!');if(boss)bossAttack('Босс кусает червя!');else{moles.push({x:Math.random()<.5?-170:W+170,t:0,bit:false});moles[moles.length-1].dir=moles[moles.length-1].x<0?1:-1}}
function bite(m){freeze=.5;flash=.25;len-=.2*curWorm().bite;sm*=1-BITE_SLOW;vib([60,40,100]);sfx('bite');puff(W/2,m.y,'#f9a',14);puff(W/2,m.y,'#c33',8);shake=.3;if(len<=.25)die(boss?boss.n+' доел червя':'Крот доел червя')}
