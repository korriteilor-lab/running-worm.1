<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Running Worm</title>
<style>
:root{--bg:#120d0a;--fg:#f3e9dc;--pn:rgba(30,20,14,.93);--ac:#e8896b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#120d0a;--fg:#f3e9dc}}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,sans-serif;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
canvas{display:block;width:100%;height:100%}
#ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.5)}
#ov.h{display:none}
.pn{background:var(--pn);border:1px solid #6a4a35;border-radius:18px;padding:20px;width:min(320px,88vw);text-align:center;box-shadow:0 0 40px rgba(232,137,107,.25)}
.pn h2{margin:0 0 6px;font-size:24px}.pn p{margin:4px 0 12px;opacity:.85;font-size:15px;line-height:1.4}
.logo{font-size:40px;font-weight:900;line-height:1;background:linear-gradient(90deg,#ffb36b,#ff6b9d,#7fe8ff,#ffb36b);background-size:300%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:lg 4s linear infinite}
@keyframes lg{to{background-position:300% 0}}
.wm{font-size:44px;display:inline-block;animation:bob 1s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-8px) rotate(8deg)}}
button,.b{display:block;width:100%;margin:8px 0;padding:13px;border-radius:12px;border:0;background:var(--ac);color:#1a0f09;font-size:17px;font-weight:700;text-decoration:none;box-sizing:border-box}
button.s,.b.s{background:#3a2a20;color:var(--fg)}
button.go{font-size:22px;background:linear-gradient(90deg,#ffb36b,#ff6b9d)}
button.sel{outline:3px solid #7fe8ff}
table{width:100%;border-collapse:collapse;margin:8px 0;font-size:15px}td{padding:5px 4px;border-bottom:1px solid #4a3426}td:last-child{text-align:right}
label{display:flex;justify-content:space-between;align-items:center;margin:12px 0;font-size:16px}
.sm{font-size:12px;opacity:.7}
</style></head><body>
<canvas id="c"></canvas><div id="ov"></div>
<script>
const cv=document.getElementById('c'),g=cv.getContext('2d'),ov=document.getElementById('ov');
let W,H,SP,HB,D=1;
function rs(){D=window.devicePixelRatio||1;W=innerWidth;H=innerHeight;cv.width=W*D;cv.height=H*D;g.setTransform(D,0,0,D,0,0);SP=H*.5;HB=SP*.5}
addEventListener('resize',rs);rs();
const M={easy:{n:'Изян',tap:.2,sw:2,red:.1,sp:1.6,life:1.7,k:.25,dm:.65,u:1},mid:{n:'Норм',tap:1,sw:4,red:.2,sp:1.25,life:1.3,k:.6,dm:.85,u:5},hard:{n:'Пздц',tap:2,sw:6,red:.35,sp:1,life:1,k:1,dm:1,u:10}};
const BITE_SLOW=.025; // замедление за каждый укус крота
let S={music:true,vib:true,vol:.6,diff:'mid'},R={easy:0,mid:0,hard:0};
try{S=Object.assign(S,JSON.parse(localStorage.getItem('ws2')||'{}'));R=Object.assign(R,JSON.parse(localStorage.getItem('wr2')||'{}'))}catch(e){}
const sv=()=>{try{localStorage.setItem('ws2',JSON.stringify(S));localStorage.setItem('wr2',JSON.stringify(R))}catch(e){}};
const cur=()=>M[S.diff],vib=p=>{if(S.vib&&navigator.vibrate)try{navigator.vibrate(p)}catch(e){}};
const rnd=(a,b)=>a+Math.random()*(b-a),cl=(v,a,b)=>Math.max(a,Math.min(b,v));
const hash=(a,b)=>{let h=Math.imul(a,374761393)+Math.imul(b,668265263);h=Math.imul(h^h>>>13,1274126177);return((h^h>>>16)>>>0)/4294967295};
const fmt=c=>c>=100?(c/100).toFixed(2)+' м':c.toFixed(1)+' см';
const medal=c=>c>=1000?'🥇':c>=500?'🥈':c>=200?'🥉':'';
// ---- audio (синтез, без лицензий)
let AC,mg,nextT=0,step=0,tempoNow=1.2;
const sc=[0,3,5,7,10,12,15];
function initAudio(){if(AC)return;try{AC=new (window.AudioContext||window.webkitAudioContext)();mg=AC.createGain();mg.connect(AC.destination);setInterval(sched,50)}catch(e){}}
function tone(f,t,d,type,v,f2){const o=AC.createOscillator(),e=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);e.gain.setValueAtTime(0,t);e.gain.linearRampToValueAtTime(v,t+.02);e.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(e);e.connect(mg);o.start(t);o.stop(t+d+.05)}
function noise(t,d,v,fr=6000,ty='highpass'){const n=AC.sampleRate*d,b=AC.createBuffer(1,n,AC.sampleRate),a=b.getChannelData(0);for(let i=0;i<n;i++)a[i]=Math.random()*2-1;const s=AC.createBufferSource(),e=AC.createGain(),f=AC.createBiquadFilter();f.type=ty;f.frequency.value=fr;s.buffer=b;e.gain.setValueAtTime(v,t);e.gain.exponentialRampToValueAtTime(.0001,t+d);s.connect(f);f.connect(e);e.connect(mg);s.start(t)}
function sched(){if(!AC)return;mg.gain.value=S.music?S.vol*.5*(mode==='play'||mode==='menu'?1:.3):0;if(AC.state==='suspended')AC.resume();
 if(nextT<AC.currentTime)nextT=AC.currentTime+.05;
 while(nextT<AC.currentTime+.15){const sl=.28/Math.max(.3,tempoNow)**.8,t=nextT,k=step%16,lv=tempoNow;
  if(k===0)tone(55,t,sl*8,'sine',.35);
  if(k%2===0||lv>1.8){const n=sc[(step*3+(step>>4))%7];tone(220*Math.pow(2,n/12)*(lv>2.4&&k%4===2?2:1),t,sl*1.6,'triangle',.12)}
  if(lv>1.5&&k%4===0)tone(70,t,.15,'sine',.5);
  if(lv>2.2&&k%2===1)noise(t,.05,.15);
  nextT+=sl;step++}}
const blip=f=>{if(AC&&S.music)tone(f,AC.currentTime,.12,'square',.08)};
const sfx=(a)=>{if(!AC||!S.music)return;const t=AC.currentTime;if(a==='boom'){noise(t,.6,.7,900,'lowpass');tone(120,t,.5,'sawtooth',.4,30)}else if(a==='bite'){tone(300,t,.25,'sawtooth',.25,80);noise(t,.1,.3,2000)}else if(a==='bad'){tone(400,t,.3,'sawtooth',.25,100)}else if(a==='gold'){[0,4,7,12].forEach((n,i)=>tone(660*Math.pow(2,n/12),t+i*.06,.15,'triangle',.15))}}
// ---- state
let mode='menu',cm,taps,oxy,t0,tankPen,items,nextItem,targets,spawnT,hits,thr,slide,drag,pull,nud,dispCm,parts,fx,moles,msg,msgT,lastV,streak,tr,len,dl,sm,shake,flash,seenS,seenT,wph=0,big=null,freeze=0,nextTank=0,lastTx=0,sup=false,band=null,nextSup=0,sws=null,gtaps=0,blk=0,back=0,seenC=0,lives=0,haze=0,hzf=0,burger=null,tg=0,lifeCd=0,nextGas=0,lGot=0,lUsed=0,bugs=[],bugT=0,bio=0,huO=0,mdl=0,recHit=0,hb=0,bestStreak=0;
function reset(){cm=0;dispCm=0;taps=0;oxy=100;t0=0;tankPen=0;items=[];nextItem=5*cur().u;targets=[];spawnT=0;hits=0;thr=Math.floor(rnd(3,6));slide=0;drag=null;pull=0;nud=0;parts=[];fx=[];moles=[];msg='';msgT=0;lastV=0;streak=0;tr=0;len=1;dl=1;sm=1;shake=0;flash=0;seenS=0;seenT=0;big=null;freeze=0;nextTank=12*cur().u;lastTx=W/2;sup=false;band=null;nextSup=rnd(25,50)*cur().u;sws=null;gtaps=0;blk=0;back=0;seenC=0;lives=0;haze=0;hzf=0;burger=null;tg=0;lifeCd=0;nextGas=rnd(18,30)*cur().u;lGot=0;lUsed=0;bugs=[];bugT=rnd(8,14);bio=0;mdl=0;recHit=0;hb=0;bestStreak=0}
reset();
const tempo=()=>{const b=Math.max(.8,1+Math.min(tg/45,2.5)*cur().k-tankPen*cur().k);return b*(1-hzf)+.5*hzf};
const say=m=>{msg=m;msgT=1.6};
function spawnItems(){const u=cur().u;while(nextItem<cm+45*u){const k=Math.floor(rnd(0,4));items.push({d:nextItem,x:k===3?W/2+rnd(-40,40):rnd(30,W-30),tank:false,k,s:rnd(.8,1.3),r:rnd(0,6),c:Math.floor(rnd(0,360))});nextItem+=rnd(3,7)*u}
 while(nextTank<cm+45*u){let x=rnd(40,W-40);for(let i=0;i<8&&Math.abs(x-lastTx)<W*.35;i++)x=rnd(40,W-40);lastTx=x;items.push({d:nextTank,x,tank:true,k:9,s:1.7,r:0,c:0});nextTank+=rnd(14,24)*u}
 while(nextGas<cm+45*u){items.push({d:nextGas,x:rnd(40,W-40),tank:false,gas:true,k:10,s:1.7,r:0,c:0});nextGas+=rnd(30,50)*u}}
function spawnTarget(){if((sup||haze>0)&&targets.length>=2)return;const r=rnd(28,40),x=rnd(r+8,W-r-8),y=rnd(SP+r+60,H-r-30);if(targets.some(t=>Math.hypot(t.x-x,t.y-y)<r*2.4))return;const m=cur(),re=m.red*cl(.5+tr/3,.5,1.6),gp={easy:.06,mid:.1,hard:.14}[S.diff],q=Math.random();let k=sup?'s':haze>0?'n':q<re?'r':q<re+.07?'y':q<re+.07+gp?'e':'n',dir=0;if(!sup&&haze<=0&&lGot<3&&lifeCd<=0&&Math.random()<.06){k='p';lifeCd=15}if(sup)dir=x<100?1:x>W-100?-1:Math.random()<.5?1:-1;targets.push({x,y,r,k,dir,born:t0,life:(k==='r'?2.2:k==='s'?3.4:k==='p'?2:2.6)*m.life/tempo()})}
function puff(x,y,c,n,sp=1){for(let i=0;i<n;i++)parts.push({x,y,vx:rnd(-90,90)*sp,vy:rnd(-130,30)*sp,l:rnd(.4,.8),c,s:rnd(3,6)})}
function startBig(){targets=[];const r=Math.min(W*.42,(H-SP)*.4);big={x:W/2,y:SP+(H-SP)/2,r,t:3,gain:0,p:0};say('БОЛЬШОЙ КРУГ! Тапай!');vib([60,40,60,40,120]);sfx('gold')}
function popup(t){mode='pop';drag=null;panel(`<p style="font-size:19px;font-weight:600">${t}</p><button onclick="mode='play';hide()">Ок</button>`)}
function explode(b){streak=0;shake=.5;flash=.35;fx.push({x:b.x,y:b.y,l:.6});puff(b.x,b.y,'#f53',22,1.6);puff(b.x,b.y,'#fb3',16,1.2);vib([80,30,120]);sfx('boom');say('БАБАХ! Крот!');moles.push({x:Math.random()<.5?-170:W+170,t:0,bit:false});moles[moles.length-1].dir=moles[moles.length-1].x<0?1:-1}
function bite(m){freeze=.5;flash=.25;len-=.2;sm*=1-BITE_SLOW;vib([60,40,100]);sfx('bite');puff(W/2,m.y,'#f9a',14);puff(W/2,m.y,'#c33',8);shake=.3;if(len<=.25)die('Крот доел червя')}
function comboCheck(){const m=cur();if(streak%40===0&&!sup){startBig()}else if(streak%10===0){cm+=m.tap*5*sm;say('Комбо ×'+streak+'!');vib([30,30,30,30,60]);blip(990)}}
function swMove(e){if(!sws)return;const dx=e.clientX-sws.x0,t=sws.t;if(!targets.includes(t)){sws=null;return}
 if(Math.abs(dx)>=60){sws=null;targets.splice(targets.indexOf(t),1);if(Math.sign(dx)===t.dir){const m=cur();taps++;streak++;cm+=m.tap*2*sm;oxy=Math.min(100,oxy+3);nud=1.2;vib([20,15,30]);blip(600+Math.random()*300);puff(t.x,t.y,'#7ff',12);comboCheck()}else{streak=0;vib(60);say('Не туда!');puff(t.x,t.y,'#f55',8)}}}
function hit(x,y,id){if(big){if(Math.hypot(x-big.x,y-big.y)<big.r){const m=cur();cm+=m.tap*sm;big.gain+=m.tap*sm;taps++;big.p=1;oxy=Math.min(100,oxy+1.5);vib(22);blip(400+Math.random()*500);puff(x,y,'#fd4',6)}return}
 let b=null,bd=1e9;for(const t of targets){const d=Math.hypot(t.x-x,t.y-y);if(d<t.r+14&&d<bd){b=t;bd=d}}
 if(!b)return;
 if(b.k==='s'){sws={id,t:b,x0:x};vib(8);try{cv.setPointerCapture(id)}catch(e){}return}
 targets.splice(targets.indexOf(b),1);if(b.k==='r'){explode(b);return}
 const m=cur();taps++;tr+=.5;
 if(b.k==='p'){taps--;lives=Math.min(3,lives+1);lGot++;vib([30,30,60]);sfx('gold');puff(b.x,b.y,'#c6f',20);say('+1 жизнь ♥ ('+lives+'/3)');return}
 if(b.k==='y'){cm=Math.max(0,cm-m.tap*3);oxy=Math.max(0,oxy-5);back=1;vib([40,20,40]);sfx('bad');puff(b.x,b.y,'#fd4',14);say('Червя тянет назад! −5% O₂');return}
 if(b.k==='e'){streak=0;cm+=1.5;nud=1.5;gtaps++;blk=1.5;shake=.5;flash=.3;fx.push({x:W/2,y:SP-20,l:.6});puff(W/2,SP-30,'#4f6',20,1.5);puff(W/2,SP-30,'#fb3',12,1.2);vib([80,30,120]);sfx('boom');if(gtaps>3){die('Разкотяшило',true);return}say('Взрыв под червём! +1.5 см ('+gtaps+'/3)');return}
 streak++;cm+=m.tap*sm;if(haze<=0)oxy=Math.min(100,oxy+2.5);nud=1;vib(18);blip(520+Math.random()*300);puff(b.x,b.y,'#7fd',8);if(haze>0)relocate(b);comboCheck();
 if(++hits>=thr){hits=0;thr=Math.floor(rnd(3,6));if(Math.random()<.25){slide=5;if(!seenS){seenS=1;popup('Не пропусти, червяка натяни')}else say('Тяни червя вверх!')}}}
const BIO=[[0,'Огород'],[50,'Глина'],[120,'Корни'],[200,'Пещера'],[350,'Кристаллы'],[500,'Руины'],[750,'Магма'],[1000,'Ядро Земли']];
function extraUpd(dt,m){if(streak>bestStreak)bestStreak=streak;
 const T=[200,500,1000],N=['🥉 Бронза! 2 м','🥈 Серебро! 5 м','🥇 Золото! 10 м'];if(mdl<3&&cm>=T[mdl]){say(N[mdl]);mdl++;vib([40,30,40,30,40,30,150]);sfx('gold');puff(W/2,HB,'#fd4',30,1.8)}
 let bi=0;for(let i=0;i<BIO.length;i++)if(cm>=BIO[i][0])bi=i;if(bi!==bio){bio=bi;say('Слой: '+BIO[bi][1]);vib(40)}
 if(!recHit&&R[S.diff]>0&&cm>R[S.diff]){recHit=1;say('НОВЫЙ РЕКОРД!');vib([40,30,40,30,120]);sfx('gold');puff(W/2,HB,'#fd4',24,1.6)}
 if(oxy<20&&haze<=0&&!burger){hb-=dt;if(hb<=0){hb=.7;vib([25,60,25]);if(AC&&S.music)tone(50,AC.currentTime,.15,'sine',.5)}}
 bugT-=dt;if(bugT<=0){bugT=rnd(12,22);if(!sup&&haze<=0&&!big){const d=Math.random()<.5?1:-1;bugs.push({x:d>0?-30:W+30,y:rnd(50,SP-60),dir:d})}}
 for(const b of bugs)b.x+=b.dir*95*dt;bugs=bugs.filter(b=>b.x>-60&&b.x<W+60)}
function addStats(){const t=S.st||(S.st={g:0,d:0,t:0,c:0});t.g++;t.d+=cm;t.t+=taps;t.c=Math.max(t.c,bestStreak);sv()}
function relocate(b){let x,y,n=0;do{x=rnd(b.r+8,W-b.r-8);y=rnd(SP+b.r+60,H-b.r-30);n++}while(n<12&&Math.hypot(x-b.x,y-b.y)<130);b.x=x;b.y=y;b.born=t0;targets.push(b)}
function hazeUpd(dt){lifeCd=Math.max(0,lifeCd-dt);if(haze>0){haze-=dt;if(haze<=0){haze=0;burger={t:0}}}if(burger){burger.t+=dt/1.1;if(burger.t>=1){burger=null;nud=1.6;vib([30,30,60]);sfx('gold');say('Ням-ням! Темп вернулся');puff(W/2,HB,'#fa4',14)}}}
function superUpd(dt,m){const u=m.u;
 if(!band&&cm>=nextSup)band={d:cm+20*u,l:6*u,done:false};
 const was=sup;sup=!!band&&!band.done&&cm>=band.d-.5*u;
 if(sup&&!was){targets=[];big=null;hits=0;sws=null;say('СУПЕР-ИГРА! Тап + свайп');vib([60,40,60,40,120]);sfx('gold');if(!seenC){seenC=1;popup('Бетон! Тапни синюю кнопку и протяни в ту сторону, куда ползёт червячок')}}
 if(band&&!band.done&&cm>=band.d+band.l){band.done=true;sup=false;targets=[];sws=null;const b=m.tap*5*sm;cm+=b;say('Бетон пройден! +'+fmt(b));vib([50,30,50,30,140]);sfx('gold');nextSup=cm+rnd(30,55)*u}
 if(band&&band.done&&band.d+band.l<dispCm-(SP-HB+60)*u/14)band=null}
// ---- input
cv.addEventListener('pointerdown',e=>{initAudio();if(mode!=='play')return;const x=e.clientX,y=e.clientY;
 if(slide>0&&!drag&&Math.hypot(x-W/2,y-(HB-nud*10))<95){drag={id:e.pointerId,y0:y};cv.setPointerCapture(e.pointerId);return}
 if(y>SP)hit(x,y,e.pointerId);else tapTank(x,y)});
function tapTank(x,y){const PX=14/cur().u;for(let i=0;i<bugs.length;i++){const b=bugs[i];if(Math.hypot(x-b.x,y-b.y)<46){bugs.splice(i,1);const m=cur(),g2=m.tap*2*sm;cm+=g2;if(haze<=0)oxy=Math.min(100,oxy+6);vib([15,10,25]);sfx('gold');puff(b.x,b.y,'#3fc',16);say('Жучок! +'+fmt(g2));return}}for(let i=0;i<items.length;i++){const it=items[i];if(!it.tank&&!it.gas)continue;const sy=HB-(it.d-dispCm)*PX+10;if(Math.hypot(x-it.x,y-sy)<58){items.splice(i,1);
 if(it.gas){haze=5;burger=null;sfx('gold');vib([40,30,40,30,80]);say('РАСКУМАР! Расслабься...');puff(it.x,sy,'#bf4',24);return}
 oxy=Math.min(100,oxy+30);tankPen+=.35;vib([30,40,30]);say('Кислород! Темп снижен');blip(880);puff(it.x,sy,'#6cf',18);return}}}
cv.addEventListener('pointermove',e=>{if(sws&&sws.id===e.pointerId)swMove(e);if(drag&&drag.id===e.pointerId){pull=cl(drag.y0-e.clientY,0,130);if(performance.now()-lastV>70){vib(10);lastV=performance.now()}
 if(pull>=100){cm+=cur().sw*sm;taps++;slide=0;drag=null;nud=2;vib([40,30,60]);say('Рывок! +'+cur().sw+' см');puff(W/2,HB-100,'#fc8',16)}}});
const up=e=>{if(sws&&sws.id===e.pointerId)sws=null;if(drag&&drag.id===e.pointerId)drag=null};cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
// ---- update
function upd(dt){
 if(mode==='menu'){dispCm+=dt*6/cur().u;return}
 if(mode!=='play')return;if(freeze>0){freeze-=dt;return}t0+=dt;if(haze<=0&&!burger)tg+=dt;hzf+=((haze>0||burger?1:0)-hzf)*Math.min(1,dt*2.5);const tp=tempo(),m=cur();tempoNow=tp*(1-.4*hzf);
 if(haze<=0&&!burger)oxy-=m.dm*(3+1.5*tp)*dt;if(oxy<=0){oxy=0;die('Червь задохнулся');return}
 if(oxy<40&&!seenT){seenT=1;popup('Дыши дядя, а то не дышишь..<br>Собирай баллоны, продолжай ползти');return}
 tr*=Math.exp(-dt*.5);len=Math.min(1,len+.012*dt);dl+=(len-dl)*Math.min(1,dt*6);
 if(big){big.t-=dt;big.p=Math.max(0,big.p-dt*6);if(big.t<=0){say('Рывок! +'+fmt(big.gain));vib([50,30,90]);big=null;spawnT=.6}}else{spawnT-=dt;if(spawnT<=0){spawnT=haze>0?2:.75*m.sp/tp;if(targets.length<3+Math.floor(tp))spawnTarget()}}
 targets=targets.filter(t=>{if(haze>0&&t.k==='n'){t.born=t0;return true}if(t0-t.born<t.life)return true;if(t.k==='n'||t.k==='s')streak=0;return false});
 if(slide>0&&!drag)slide-=dt;
 if(!drag)pull+=(0-pull)*Math.min(1,dt*10);

function help(go){panel(`<h2>Как играть</h2><div style="text-align:left;font-size:15px;line-height:1.85"><b style="color:#7ff">● Синий</b> — жми<br><b style="color:#fd4">● Жёлтый</b> — нажал, не сильно страшно<br><b style="color:#f55">● Красный</b> — не жми<br><b style="color:#4f6">● Зелёный</b> — бум под червём (+1,5 см), 4-й раз смертелен<br><b style="color:#c6f">● Фиолетовый ♥</b> — доп. жизнь (всего 3 за партию)<br><b style="color:#3af">▮ Синий баллон</b> — кислород, тапни по нему<br><b style="color:#bf4">▮ Раскумар</b> — салатовый баллон, 5 с замедления<br><b style="color:#2bd68a">● Жучок</b> — тапни в грунте: +см и кислород<br><span class="sm">Подсвеченную голову червя тяни вверх. На бетоне — тап + свайп.</span></div>${go?'<button class="go" onclick="start(1)">Пашол</button>':'<button onclick="menu()">Назад</button>'}`)}
function start(f){if(!S.help&&!f){S.help=1;sv();help(true);return}initAudio();reset();mode='play';hide()}
function pause(){mode='pause';panel(`<h2>Пауза</h2><p>${fmt(cm)}</p><button onclick="mode='play';hide()">Продолжить</button><button class="s" onclick="finish()">Финиш (сохранить рекорд)</button><button class="s" onclick="settings('pause')">Настройки</button><button class="s" onclick="menu()">В меню без сохранения</button>`)}
function setD(d){S.diff=d;sv();reset();diffMenu()}
function diffMenu(){const info={easy:'0,2 см за тап • красных 10%',mid:'1 см за тап • красных 20%',hard:'2 см за тап • красных 35%'};const db=Object.keys(M).map(k=>`<button class="s ${S.diff===k?'sel':''}" onclick="setD('${k}')">${M[k].n}<br><span class="sm">${info[k]}</span></button>`).join('');panel(`<h2>Сложность</h2>${db}<button onclick="menu()">Назад</button>`)}
function settings(f){const db=Object.keys(M).map(k=>`<button class="s ${S.diff===k?'sel':''}" style="display:inline-block;width:31%;margin:2px;padding:10px 0" onclick="setD('${k}','${f}')">${M[k].n}</button>`).join('');
 panel(`<h2>Настройки</h2><label>Музыка <input type="checkbox" ${S.music?'checked':''} onchange="S.music=this.checked;sv()"></label><label>Вибрация <input type="checkbox" ${S.vib?'checked':''} onchange="S.vib=this.checked;sv();vib(40)"></label><label>Громкость <input type="range" min="0" max="1" step=".05" value="${S.vol}" oninput="S.vol=+this.value;sv()"></label><button onclick="${f==='menu'?'menu()':'pause()'}">Назад</button>`)}
function quit(){try{const c=window.Capacitor;if(c&&c.Plugins&&c.Plugins.App){c.Plugins.App.exitApp();return}}catch(e){}window.close();panel('<h2>Выход</h2><p>Можно закрыть вкладку или приложение.</p><button onclick="menu()">В меню</button>')}
menu();
</script></body></html>
